<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>지역별 맛집 지도</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 35%;
      min-width: 350px;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .header {
      padding: 18px;
      border-bottom: 1px solid #eee;
    }

    .header h2 {
      margin-bottom: 12px;
    }

    .tabs,
    .controls,
    .pagination {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .tab-button {
      flex: 1;
      padding: 10px;
      background: #eee;
    }

    .tab-button.active {
      background: #fee500;
    }

    .search-area {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .search-area input {
      flex: 1;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .search-area button {
      padding: 11px 15px;
      background: #222;
      color: white;
    }

    .control-button,
    .page-button {
      flex: 1;
      padding: 10px;
      background: #f1f1f1;
    }

    .page-button:disabled {
      background: #ddd;
      color: #999;
      cursor: not-allowed;
    }

    .page-info {
      text-align: center;
      margin-top: 8px;
      font-size: 13px;
      color: #666;
    }

    .result-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .place-item {
      padding: 14px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .place-item:hover {
      background: #fafafa;
    }

    .place-name {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 6px;
    }

    .place-info {
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
    }

    .category-label {
      display: inline-block;
      margin-top: 5px;
      padding: 4px 7px;
      border-radius: 6px;
      font-size: 12px;
      background: #f0f0f0;
    }

    .map-section {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #map {
      flex: 2;
    }

    #roadview {
      flex: 1;
      border-top: 2px solid #ddd;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="sidebar">
      <div class="header">
        <h2>🍽 지역별 맛집 지도</h2>

        <div class="tabs">
          <button class="tab-button active" id="foodTab">음식점</button>
          <button class="tab-button" id="cafeTab">카페</button>
        </div>

        <div class="search-area">
          <input id="keywordInput" type="text" placeholder="예: 홍대 파스타 / 성수 카페" />
          <button id="searchButton">검색</button>
        </div>

        <div class="controls">
          <button class="control-button" id="locationButton">현재 위치</button>
          <button class="control-button" id="trafficButton">교통정보</button>
        </div>

        <div class="pagination">
          <button class="page-button" id="prevButton">이전</button>
          <button class="page-button" id="nextButton">다음</button>
        </div>

        <div class="page-info" id="pageInfo">1페이지</div>
      </div>

      <div class="result-list" id="resultList"></div>
    </div>

    <div class="map-section">
      <div id="map"></div>
      <div id="roadview"></div>
    </div>

  </div>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=67fecb4324df1a6f9c90cb0c1a04980c&libraries=services&autoload=false"></script>

  <script>
    let map;
    let roadview;
    let roadviewClient;
    let placesService;
    let infoWindow;

    let currentPosition;
    let markerList = [];
    let currentCategory = "FD6";
    let currentMode = "category";
    let currentKeyword = "";
    let currentPagination = null;
    let currentPage = 1;
    let trafficVisible = false;

    // 카카오맵 로드 후 실행
    kakao.maps.load(function () {
      initializeMap();
    });

    // 지도 초기화
    function initializeMap() {
      const defaultPosition = new kakao.maps.LatLng(37.5665, 126.9780);

      map = new kakao.maps.Map(document.getElementById("map"), {
        center: defaultPosition,
        level: 5
      });

      roadview = new kakao.maps.Roadview(document.getElementById("roadview"));
      roadviewClient = new kakao.maps.RoadviewClient();
      placesService = new kakao.maps.services.Places();
      infoWindow = new kakao.maps.InfoWindow({ removable: true });

      getCurrentLocation();
      searchByCategory("FD6", 1);
    }

    // 현재 위치 가져오기
    function getCurrentLocation() {
      if (!navigator.geolocation) {
        alert("현재 위치 기능을 사용할 수 없습니다.");
        return;
      }

      navigator.geolocation.getCurrentPosition(function (position) {
        currentPosition = new kakao.maps.LatLng(
          position.coords.latitude,
          position.coords.longitude
        );

        map.setCenter(currentPosition);

        const currentMarker = new kakao.maps.Marker({
          map: map,
          position: currentPosition
        });

        const currentInfo = new kakao.maps.InfoWindow({
          content: "<div style='padding:8px;'>📍 현재 위치</div>"
        });

        currentInfo.open(map, currentMarker);

        searchByCategory(currentCategory, 1);
      });
    }

    // 카테고리 검색
    function searchByCategory(categoryCode, pageNumber) {
      currentMode = "category";
      currentCategory = categoryCode;
      currentPage = pageNumber;

      removeMarkers();

      const option = {
        page: pageNumber,
        size: 10
      };

      if (currentPosition) {
        option.location = currentPosition;
        option.radius = 3000;
      }

      placesService.categorySearch(categoryCode, function (data, status, pagination) {
        if (status === kakao.maps.services.Status.OK) {
          currentPagination = pagination;
          displayPlaces(data);
          updatePageButtons(pagination);
        } else {
          showNoResult();
        }
      }, option);
    }

    // 키워드 검색
    function searchByKeyword(pageNumber) {
      const keyword = document.getElementById("keywordInput").value.trim();

      if (!keyword && !currentKeyword) {
        alert("검색어를 입력해주세요.");
        return;
      }

      if (keyword) {
        currentKeyword = keyword;
      }

      currentMode = "keyword";
      currentPage = pageNumber;

      removeMarkers();

      const option = {
        page: pageNumber,
        size: 10
      };

      if (currentPosition) {
        option.location = currentPosition;
      }

      placesService.keywordSearch(currentKeyword, function (data, status, pagination) {
        if (status === kakao.maps.services.Status.OK) {
          currentPagination = pagination;
          displayPlaces(data);
          updatePageButtons(pagination);
        } else {
          showNoResult();
        }
      }, option);
    }

    // 검색 결과 출력
    function displayPlaces(places) {
      const resultList = document.getElementById("resultList");
      resultList.innerHTML = "";

      const bounds = new kakao.maps.LatLngBounds();

      places.forEach(function (place) {
        const position = new kakao.maps.LatLng(place.y, place.x);
        const markerImage = createMarkerImage(place.category_group_code);

        const marker = new kakao.maps.Marker({
          map: map,
          position: position,
          image: markerImage
        });

        markerList.push(marker);
        bounds.extend(position);

        const item = document.createElement("div");
        item.className = "place-item";

        item.innerHTML = `
          <div class="place-name">${place.place_name}</div>
          <div class="place-info">📍 ${place.road_address_name || place.address_name}</div>
          <div class="place-info">🕒 영업시간은 상세보기에서 확인</div>
          <span class="category-label">${getCategoryName(place.category_group_code)}</span>
        `;

        item.addEventListener("click", function () {
          map.setCenter(position);
          map.setLevel(4);
          showDetailPopup(place, marker);
          connectRoadview(position);
        });

        kakao.maps.event.addListener(marker, "click", function () {
          showDetailPopup(place, marker);
          connectRoadview(position);
        });

        resultList.appendChild(item);
      });

      map.setBounds(bounds);
    }

    // 카테고리별 다른 마커 이미지
    function createMarkerImage(categoryCode) {
      let imageUrl;

      if (categoryCode === "FD6") {
        // 음식점 마커
        imageUrl = "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png";
      } else if (categoryCode === "CE7") {
        // 카페 마커
        imageUrl = "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png";
      } else {
        // 기타 검색 결과 마커
        imageUrl = "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_blue.png";
      }

      const imageSize = new kakao.maps.Size(24, 35);

      return new kakao.maps.MarkerImage(imageUrl, imageSize);
    }

    // 카테고리 이름 변환
    function getCategoryName(categoryCode) {
      if (categoryCode === "FD6") {
        return "음식점";
      }

      if (categoryCode === "CE7") {
        return "카페";
      }

      return "기타 장소";
    }

    // 상세 팝업
    function showDetailPopup(place, marker) {
      const content = `
        <div style="padding:12px; width:240px; font-size:13px; line-height:1.6;">
          <strong style="font-size:15px;">${place.place_name}</strong><br>
          📍 ${place.road_address_name || place.address_name}<br>
          📞 ${place.phone || "전화번호 없음"}<br>
          <a href="${place.place_url}" target="_blank">카카오맵 상세보기</a>
        </div>
      `;

      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    // 로드뷰 연동
    function connectRoadview(position) {
      roadviewClient.getNearestPanoId(position, 50, function (panoId) {
        if (panoId) {
          roadview.setPanoId(panoId, position);
        } else {
          alert("이 장소 주변에는 로드뷰가 없습니다.");
        }
      });
    }

    // 페이지 버튼 업데이트
    function updatePageButtons(pagination) {
      document.getElementById("pageInfo").textContent = currentPage + "페이지";

      document.getElementById("prevButton").disabled = currentPage <= 1;
      document.getElementById("nextButton").disabled = !pagination.hasNextPage;
    }

    // 이전 페이지
    function goPrevPage() {
      if (currentPage <= 1) {
        return;
      }

      const nextPage = currentPage - 1;

      if (currentMode === "category") {
        searchByCategory(currentCategory, nextPage);
      } else {
        searchByKeyword(nextPage);
      }
    }

    // 다음 페이지
    function goNextPage() {
      if (!currentPagination || !currentPagination.hasNextPage) {
        return;
      }

      const nextPage = currentPage + 1;

      if (currentMode === "category") {
        searchByCategory(currentCategory, nextPage);
      } else {
        searchByKeyword(nextPage);
      }
    }

    // 결과 없음 표시
    function showNoResult() {
      removeMarkers();

      document.getElementById("resultList").innerHTML =
        "<p style='padding:15px;'>검색 결과가 없습니다.</p>";

      document.getElementById("pageInfo").textContent = "-";
      document.getElementById("prevButton").disabled = true;
      document.getElementById("nextButton").disabled = true;
    }

    // 기존 마커 지우기
    function removeMarkers() {
      markerList.forEach(function (marker) {
        marker.setMap(null);
      });

      markerList = [];

      if (infoWindow) {
        infoWindow.close();
      }
    }

    // 교통정보 표시
    function toggleTraffic() {
      if (trafficVisible) {
        map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);
        trafficVisible = false;
      } else {
        map.addOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);
        trafficVisible = true;
      }
    }

    // 음식점 탭
    document.getElementById("foodTab").addEventListener("click", function () {
      currentKeyword = "";
      currentCategory = "FD6";

      document.getElementById("foodTab").classList.add("active");
      document.getElementById("cafeTab").classList.remove("active");

      searchByCategory("FD6", 1);
    });

    // 카페 탭
    document.getElementById("cafeTab").addEventListener("click", function () {
      currentKeyword = "";
      currentCategory = "CE7";

      document.getElementById("cafeTab").classList.add("active");
      document.getElementById("foodTab").classList.remove("active");

      searchByCategory("CE7", 1);
    });

    // 검색 버튼
    document.getElementById("searchButton").addEventListener("click", function () {
      currentKeyword = "";
      searchByKeyword(1);
    });

    // 엔터 검색
    document.getElementById("keywordInput").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        currentKeyword = "";
        searchByKeyword(1);
      }
    });

    // 현재 위치 버튼
    document.getElementById("locationButton").addEventListener("click", function () {
      if (currentPosition) {
        map.setCenter(currentPosition);
        map.setLevel(5);
      } else {
        getCurrentLocation();
      }
    });

    // 교통정보 버튼
    document.getElementById("trafficButton").addEventListener("click", toggleTraffic);

    // 페이지 버튼
    document.getElementById("prevButton").addEventListener("click", goPrevPage);
    document.getElementById("nextButton").addEventListener("click", goNextPage);
  </script>

</body>
</html>
