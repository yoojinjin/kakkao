<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>지역별 맛집 지도</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 300px;
      min-width: 300px;
      height: 100vh;
      background: white;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .header {
      padding: 16px;
      border-bottom: 1px solid #eee;
      background: white;
    }

    .header h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .intro {
      font-size: 12px;
      color: #666;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tab-button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #eeeeee;
      cursor: pointer;
      font-weight: bold;
    }

    .tab-button.active {
      background: #fee500;
    }

    .search-area {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .search-area input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 13px;
    }

    .search-area button {
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .controls,
    .pagination {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .control-button,
    .page-button {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 8px;
      background: #f1f1f1;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .page-button:disabled {
      background: #dddddd;
      color: #999999;
      cursor: not-allowed;
    }

    .page-info {
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: #666666;
    }

    .result-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background: white;
    }

    .place-item {
      padding: 12px;
      border-bottom: 1px solid #eeeeee;
      cursor: pointer;
    }

    .place-item:hover {
      background: #fafafa;
    }

    .place-name {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .place-info {
      font-size: 12px;
      color: #666666;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .category-label {
      display: inline-block;
      margin-top: 5px;
      padding: 4px 7px;
      border-radius: 6px;
      font-size: 11px;
      background: #f0f0f0;
    }

    .map-section {
      flex: 1;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: white;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
    }

    .popup-button {
      display: inline-block;
      margin-top: 6px;
      padding: 5px 8px;
      background: #fee500;
      color: #222;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="sidebar">

      <div class="header">

        <h2>🍽 지역별 맛집 지도</h2>

        <p class="intro">
          현재 위치 주변의 맛집과 카페를 카테고리별로 빠르게 찾아볼 수 있어
          외식 장소를 쉽고 편하게 탐색할 수 있어요.
        </p>

        <div class="tabs">
          <button class="tab-button active" id="foodTab">음식점</button>
          <button class="tab-button" id="cafeTab">카페</button>
        </div>

        <div class="search-area">
          <input
            id="keywordInput"
            type="text"
            placeholder="예: 홍대 파스타 / 성수"
          />
          <button id="searchButton">검색</button>
        </div>

        <div class="controls">
          <button class="control-button" id="locationButton">현재 위치</button>
          <button class="control-button" id="trafficButton">교통정보</button>
        </div>

        <div class="pagination">
          <button class="page-button" id="prevButton">이전</button>
          <button class="page-button" id="nextButton">다음</button>
        </div>

        <div class="page-info" id="pageInfo">1페이지</div>

      </div>

      <div class="result-list" id="resultList"></div>

    </div>

    <div class="map-section">
      <div id="map"></div>
    </div>

  </div>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=67fecb4324df1a6f9c90cb0c1a04980c&libraries=services&autoload=false"></script>

  <script>
    let map;
    let placesService;
    let infoWindow;

    let currentPosition;
    let currentLocationMarker;
    let markerList = [];

    let currentCategory = "FD6";
    let currentMode = "category";
    let currentKeyword = "";
    let currentPagination = null;
    let currentPage = 1;
    let trafficVisible = false;

    // 카카오맵이 완전히 로드된 뒤 실행
    kakao.maps.load(function () {
      initializeMap();
    });

    // 지도 초기화
    function initializeMap() {
      const defaultPosition = new kakao.maps.LatLng(37.5665, 126.9780);

      map = new kakao.maps.Map(document.getElementById("map"), {
        center: defaultPosition,
        level: 5
      });

      // 지도 크기 계산 오류 방지
      setTimeout(function () {
        map.relayout();
        map.setCenter(defaultPosition);
      }, 100);

      placesService = new kakao.maps.services.Places();
      infoWindow = new kakao.maps.InfoWindow({
        removable: true
      });

      getCurrentLocation();
      searchByCategory("FD6", 1);
    }

    // 현재 위치 가져오기
    function getCurrentLocation() {
      if (!navigator.geolocation) {
        alert("현재 위치 기능을 사용할 수 없습니다.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (position) {
          currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          map.relayout();
          map.setCenter(currentPosition);
          map.setLevel(5);

          if (currentLocationMarker) {
            currentLocationMarker.setMap(null);
          }

          currentLocationMarker = new kakao.maps.Marker({
            map: map,
            position: currentPosition
          });

          const currentInfo = new kakao.maps.InfoWindow({
            content: "<div style='padding:8px;'>📍 현재 위치</div>"
          });

          currentInfo.open(map, currentLocationMarker);

          searchByCategory(currentCategory, 1);
        },

        function () {
          alert("위치 권한을 허용하면 현재 위치 주변 장소를 볼 수 있습니다.");
        }
      );
    }

    // 카테고리 검색
    function searchByCategory(categoryCode, pageNumber) {
      currentMode = "category";
      currentCategory = categoryCode;
      currentPage = pageNumber;
      currentKeyword = "";

      removeMarkers();

      const option = {
        page: pageNumber,
        size: 10
      };

      if (currentPosition) {
        option.location = currentPosition;
        option.radius = 3000;
      }

      placesService.categorySearch(
        categoryCode,
        function (data, status, pagination) {
          if (status === kakao.maps.services.Status.OK) {
            currentPagination = pagination;
            displayPlaces(data);
            updatePageButtons(pagination);
          } else {
            showNoResult();
          }
        },
        option
      );
    }

    // 키워드 검색
    function searchByKeyword(pageNumber) {
      const inputKeyword = document.getElementById("keywordInput").value.trim();

      if (!inputKeyword && !currentKeyword) {
        alert("검색어를 입력해주세요.");
        return;
      }

      // 음식점 탭에서는 음식점만, 카페 탭에서는 카페만 검색
      if (inputKeyword) {
        if (currentCategory === "FD6") {
          currentKeyword = inputKeyword + " 음식점";
        } else if (currentCategory === "CE7") {
          currentKeyword = inputKeyword + " 카페";
        }
      }

      currentMode = "keyword";
      currentPage = pageNumber;

      removeMarkers();

      const option = {
        page: pageNumber,
        size: 10
      };

      if (currentPosition) {
        option.location = currentPosition;
        option.radius = 3000;
      }

      placesService.keywordSearch(
        currentKeyword,
        function (data, status, pagination) {
          if (status === kakao.maps.services.Status.OK) {
            currentPagination = pagination;

            const filteredData = data.filter(function (place) {
              return place.category_group_code === currentCategory;
            });

            if (filteredData.length > 0) {
              displayPlaces(filteredData);
              updatePageButtons(pagination);
            } else {
              showNoResult();
            }
          } else {
            showNoResult();
          }
        },
        option
      );
    }

    // 검색 결과 표시
    function displayPlaces(places) {
      const resultList = document.getElementById("resultList");
      resultList.innerHTML = "";

      const bounds = new kakao.maps.LatLngBounds();

      places.forEach(function (place) {
        const position = new kakao.maps.LatLng(place.y, place.x);

        const marker = new kakao.maps.Marker({
          map: map,
          position: position,
          image: createMarkerImage(place.category_group_code)
        });

        markerList.push(marker);
        bounds.extend(position);

        const item = document.createElement("div");
        item.className = "place-item";

        item.innerHTML = `
          <div class="place-name">${place.place_name}</div>
          <div class="place-info">📍 ${place.road_address_name || place.address_name}</div>
          <div class="place-info">📞 ${place.phone || "전화번호 없음"}</div>
          <div class="place-info">🕒 영업시간은 상세보기에서 확인</div>
          <span class="category-label">${getCategoryName(place.category_group_code)}</span>
        `;

        item.addEventListener("click", function () {
          map.setCenter(position);
          map.setLevel(4);
          showDetailPopup(place, marker);
        });

        kakao.maps.event.addListener(marker, "click", function () {
          showDetailPopup(place, marker);
        });

        resultList.appendChild(item);
      });

      if (places.length > 0) {
        map.setBounds(bounds);

        setTimeout(function () {
          map.relayout();
        }, 100);
      }
    }

    // 카테고리별 다른 마커
    function createMarkerImage(categoryCode) {
      let imageUrl;

      if (categoryCode === "FD6") {
        imageUrl = "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png";
      } else if (categoryCode === "CE7") {
        imageUrl = "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png";
      } else {
        imageUrl = "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_blue.png";
      }

      const imageSize = new kakao.maps.Size(24, 35);

      return new kakao.maps.MarkerImage(imageUrl, imageSize);
    }

    // 카테고리 이름 표시
    function getCategoryName(categoryCode) {
      if (categoryCode === "FD6") {
        return "음식점";
      }

      if (categoryCode === "CE7") {
        return "카페";
      }

      return "기타 장소";
    }

    // 마커 클릭 시 상세 팝업
    function showDetailPopup(place, marker) {
      const roadviewUrl =
        "https://map.kakao.com/link/roadview/" + place.y + "," + place.x;

      const content = `
        <div style="padding:12px; width:245px; font-size:13px; line-height:1.6;">
          <strong style="font-size:15px;">${place.place_name}</strong><br>
          📍 ${place.road_address_name || place.address_name}<br>
          📞 ${place.phone || "전화번호 없음"}<br>
          <a href="${place.place_url}" target="_blank">카카오맵 상세보기</a><br>
          <a class="popup-button" href="${roadviewUrl}" target="_blank">로드뷰 열기</a>
        </div>
      `;

      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    // 페이지 버튼 업데이트
    function updatePageButtons(pagination) {
      document.getElementById("pageInfo").textContent = currentPage + "페이지";

      document.getElementById("prevButton").disabled = currentPage <= 1;
      document.getElementById("nextButton").disabled = !pagination.hasNextPage;
    }

    // 이전 페이지
    function goPrevPage() {
      if (currentPage <= 1) {
        return;
      }

      if (currentMode === "category") {
        searchByCategory(currentCategory, currentPage - 1);
      } else {
        searchByKeyword(currentPage - 1);
      }
    }

    // 다음 페이지
    function goNextPage() {
      if (!currentPagination || !currentPagination.hasNextPage) {
        return;
      }

      if (currentMode === "category") {
        searchByCategory(currentCategory, currentPage + 1);
      } else {
        searchByKeyword(currentPage + 1);
      }
    }

    // 검색 결과 없음
    function showNoResult() {
      removeMarkers();

      document.getElementById("resultList").innerHTML =
        "<p style='padding:15px;'>검색 결과가 없습니다.</p>";

      document.getElementById("pageInfo").textContent = "-";
      document.getElementById("prevButton").disabled = true;
      document.getElementById("nextButton").disabled = true;
    }

    // 기존 마커 제거
    function removeMarkers() {
      markerList.forEach(function (marker) {
        marker.setMap(null);
      });

      markerList = [];

      if (infoWindow) {
        infoWindow.close();
      }
    }

    // 교통정보 켜기/끄기
    function toggleTraffic() {
      if (trafficVisible) {
        map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);
        trafficVisible = false;
      } else {
        map.addOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);
        trafficVisible = true;
      }
    }

    // 음식점 탭 클릭
    document.getElementById("foodTab").addEventListener("click", function () {
      document.getElementById("keywordInput").value = "";
      currentCategory = "FD6";

      document.getElementById("foodTab").classList.add("active");
      document.getElementById("cafeTab").classList.remove("active");

      searchByCategory("FD6", 1);
    });

    // 카페 탭 클릭
    document.getElementById("cafeTab").addEventListener("click", function () {
      document.getElementById("keywordInput").value = "";
      currentCategory = "CE7";

      document.getElementById("cafeTab").classList.add("active");
      document.getElementById("foodTab").classList.remove("active");

      searchByCategory("CE7", 1);
    });

    // 검색 버튼 클릭
    document.getElementById("searchButton").addEventListener("click", function () {
      currentKeyword = "";
      searchByKeyword(1);
    });

    // 엔터 검색
    document.getElementById("keywordInput").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        currentKeyword = "";
        searchByKeyword(1);
      }
    });

    // 현재 위치 버튼
    document.getElementById("locationButton").addEventListener("click", function () {
      if (currentPosition) {
        map.relayout();
        map.setCenter(currentPosition);
        map.setLevel(5);
      } else {
        getCurrentLocation();
      }
    });

    // 교통정보 버튼 클릭
    document.getElementById("trafficButton").addEventListener("click", toggleTraffic);

    // 페이지 버튼 클릭
    document.getElementById("prevButton").addEventListener("click", goPrevPage);
    document.getElementById("nextButton").addEventListener("click", goNextPage);

    // 창 크기 변경 시 지도 다시 계산
    window.addEventListener("resize", function () {
      if (map) {
        map.relayout();
      }
    });
  </script>

</body>
</html>
